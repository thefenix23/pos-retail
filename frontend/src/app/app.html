<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">POS Retail - Fase 0</h1>

    @if (error()) {
      <p class="text-red-600 bg-red-50 rounded-lg p-3">
        {{ error() }}
      </p>
    }

    @for (p of pings(); track p.id) {
      <div class="border border-gray-200 rounded-lg p-4 mt-3">
        <p class="text-lg font-semibold text-green-700">{{ p.msg }}</p>
        <p class="text-sm text-gray-500">ID: {{ p.id }}</p>
        <p class="text-sm text-gray-500">Fecha: {{ p.createdAt }}</p>
      </div>
    }
  </div>
</div>
