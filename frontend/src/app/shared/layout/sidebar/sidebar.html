<aside class="w-60 bg-blue-800 text-white flex flex-col min-h-screen">
  <!-- Marca -->
  <div class="px-5 py-5 border-b border-blue-700">
    <p class="text-lg font-bold">POS Retail</p>
  </div>

  <!-- Navegación -->
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a
      routerLink="/"
      routerLinkActive="bg-blue-700"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-blue-50 hover:bg-blue-700 transition"
    >
      <span class="material-symbols-outlined">dashboard</span>
      Panel principal
    </a>

    <a
      routerLink="/products"
      routerLinkActive="bg-blue-700"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-blue-50 hover:bg-blue-700 transition"
    >
      <span class="material-symbols-outlined">inventory_2</span>
      Productos
    </a>

    <!-- Punto de venta: abre el cashier a pantalla completa -->
    <a
      routerLink="/pos"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-blue-50 hover:bg-blue-700 transition"
    >
      <span class="material-symbols-outlined">point_of_sale</span>
      Punto de venta
    </a>

    <a
      routerLink="/ventas"
      routerLinkActive="...clases-activas..."
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-blue-50 hover:bg-blue-700 transition"
    >
      <span class="material-symbols-outlined">receipt_long</span>
      Ventas
    </a>
  </nav>
</aside>
