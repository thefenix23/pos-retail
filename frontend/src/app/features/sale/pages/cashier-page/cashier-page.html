<div class="min-h-screen bg-slate-100 flex flex-col">

  <!-- Barra superior -->
  <header class="bg-blue-700 text-white px-6 py-2.5 flex items-center justify-between text-sm">
    <div class="flex items-center gap-6">
      <span class="font-semibold">POS Retail</span>
      <span class="text-blue-100">Caja: 02</span>
      <span class="text-blue-100">Sucursal: Centro</span>
    </div>

    <div class="flex items-center gap-6">
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>Online
      </span>
      <span>Le atiende: <span class="font-medium">------</span></span>
      <button
        routerLink="/"
        class="p-2 rounded-md hover:bg-blue-600 transition-colors cursor-pointer"
        aria-label="Ir a dashboard"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1 p-3">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-5 items-stretch">
      <!-- Columna izquierda: captura + tabla -->
      <div class="lg:col-span-3 flex flex-col gap-5">
        <app-capture-input></app-capture-input>
        <app-cart-table></app-cart-table>
      </div>

      <!-- Columna derecha: resumen y cobro -->
      <app-sale-summary
        (checkoutRequested)="openModal()"
      ></app-sale-summary>
    </div>
  </main>

  <app-payment-modal
    [open]="modalOpen()"
    (closed)="closeModal()"
    (completed)="onSaleCompleted($event)"
  ></app-payment-modal>
</div>
