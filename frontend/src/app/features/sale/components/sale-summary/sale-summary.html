<aside class="h-full bg-white rounded-xl border border-slate-200 p-5 flex flex-col">
  <h2 class="text-base font-semibold text-slate-800 mb-4">Ticket actual</h2>

  <div class="space-y-4 py-4 border-t border-slate-200 pt-4">
    <div class="flex justify-between  py-6 border-b border-slate-200">
      <span class="text-slate-500 ">Subtotal ({{ articulosLabel() }})</span>
      <span class="text-slate-800">{{ cart.total() | number : '1.2-2' }}</span>
    </div>

    <div class="flex justify-between text-sm py-5 border-b border-slate-200">
      <span class="text-slate-500">IVA incluido</span>
      <span class="text-slate-800">Incluido</span>
    </div>
  </div>

  <div class="mt-auto">
    <div class="bg-blue-50 rounded-xl px-4 py-4 mb-4">
      <p class="text-sm text-blue-700 font-medium">Por pagar (M.N)</p>
      <p class="text-4xl font-bold text-blue-700 mt-1">${{ cart.total() | number : '1.2-2' }}</p>
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600 mb-3">{{ errorMessage() }}</p>
    }

    <button
      (click)="requestCheckout()"
      [aria-disabled]="cart.items().length === 0"
      [disabled]="processing() || cart.items().length === 0"
      class="w-full bg-green-600 text-white rounded-xl py-2 font-semibold text-lg hover:bg-green-700 disabled:bg-slate-300 disabled:cursor-not-allowed"
    >
      Cobrar
    </button>
  </div>
</aside>
