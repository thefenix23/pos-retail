spring:
  application:
    name: backend

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
    username: pos_app
    password: Oracle123
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
    show_sql: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: POS_APP
    default-schema: POS_APP
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080